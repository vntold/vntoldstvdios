<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>VNTOLD STVDIO®</title>

    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <main class="page">
      <div class="center-wrap">
        <!-- PASSWORD ENTRY -->
        <form class="password-form" id="passwordForm">
          <input
            type="password"
            class="password-input"
            id="password"
            placeholder="Password"
            aria-label="Password"
            autocomplete="current-password"
            required
          />

          <button
            class="password-submit"
            type="submit"
            aria-label="Enter website"
          >
            →
          </button>
        </form>

        <!-- COUNTDOWN -->
        <div class="countdown">
          <div class="time-box">
            <span class="number" id="days">20</span>
            <span class="label">days</span>
          </div>

          <div class="time-box">
            <span class="number" id="hours">00</span>
            <span class="label">hours</span>
          </div>

          <div class="time-box">
            <span class="number" id="minutes">00</span>
            <span class="label">minutes</span>
          </div>

          <div class="time-box">
            <span class="number" id="seconds">00</span>
            <span class="label">seconds</span>
          </div>
        </div>

        <!-- BRAND -->
        <div class="brand-row">
          <div class="brand-left">
            <div class="symbol">✱</div>

            <div class="brand-name">
              <span>vntold</span>
              <span>stvdio</span>
            </div>
          </div>

          <div class="divider"></div>

          <div class="descriptor">
            creative<br />
            design studio
          </div>
        </div>
      </div>

      <!-- LARGE BOTTOM TEXT -->
      <div class="coming-soon-wrap">
        <div class="coming-soon" id="comingSoon">Coming soon</div>
      </div>
    </main>

    <script>
      /* =========================
         COUNTDOWN
      ========================= */

      const launchDate = new Date("2026-09-08T00:00:00+10:00").getTime();

      function updateCountdown() {
        const now = Date.now();
        const distance = launchDate - now;

        if (distance <= 0) {
          document.getElementById("days").textContent = "00";
          document.getElementById("hours").textContent = "00";
          document.getElementById("minutes").textContent = "00";
          document.getElementById("seconds").textContent = "00";
          return;
        }

        const days = Math.floor(distance / (1000 * 60 * 60 * 24));

        const hours = Math.floor(
          (distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60),
        );

        const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));

        const seconds = Math.floor((distance % (1000 * 60)) / 1000);

        document.getElementById("days").textContent = String(days).padStart(
          2,
          "0",
        );

        document.getElementById("hours").textContent = String(hours).padStart(
          2,
          "0",
        );

        document.getElementById("minutes").textContent = String(
          minutes,
        ).padStart(2, "0");

        document.getElementById("seconds").textContent = String(
          seconds,
        ).padStart(2, "0");
      }

      updateCountdown();
      setInterval(updateCountdown, 1000);

      /* =========================
         FIT "COMING SOON"
      ========================= */

      function fitComingSoon() {
        const text = document.getElementById("comingSoon");

        text.style.transform = "scaleX(1)";

        const textWidth = text.getBoundingClientRect().width;

        const targetWidth = window.innerWidth * 0.97;

        const scale = targetWidth / textWidth;

        text.style.transform = `scaleX(${scale})`;
      }

      window.addEventListener("load", fitComingSoon);
      window.addEventListener("resize", fitComingSoon);

      /* =========================
         PASSWORD FORM
      ========================= */

      const passwordForm = document.getElementById("passwordForm");

      passwordForm.addEventListener("submit", function (event) {
        event.preventDefault();

        /*
          Password checking can be connected
          to Cloudflare later.

          For now this stops the page refreshing.
        */
      });
    </script>
  </body>
</html>
