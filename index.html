<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>VNTOLD STVDIOS</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <main class="coming-soon">
      <div class="content">
        <h1 class="title">vntold stvdios</h1>

        <div class="countdown">
          <div class="time-box">
            <span class="number" id="days">21</span>
            <span class="label">days</span>
          </div>

          <div class="time-box">
            <span class="number" id="hours">00</span>
            <span class="label">hours</span>
          </div>

          <div class="time-box">
            <span class="number" id="minutes">00</span>
            <span class="label">minutes</span>
          </div>

          <div class="time-box">
            <span class="number" id="seconds">00</span>
            <span class="label">seconds</span>
          </div>
        </div>
      </div>
    </main>

    <script>
      const launchDate = new Date("2026-09-08T00:00:00+10:00").getTime();

      function updateCountdown() {
        const now = new Date().getTime();
        const distance = launchDate - now;

        if (distance <= 0) {
          document.getElementById("days").textContent = "00";
          document.getElementById("hours").textContent = "00";
          document.getElementById("minutes").textContent = "00";
          document.getElementById("seconds").textContent = "00";
          return;
        }

        const days = Math.floor(distance / (1000 * 60 * 60 * 24));

        const hours = Math.floor(
          (distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60),
        );

        const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));

        const seconds = Math.floor((distance % (1000 * 60)) / 1000);

        document.getElementById("days").textContent = String(days).padStart(
          2,
          "0",
        );

        document.getElementById("hours").textContent = String(hours).padStart(
          2,
          "0",
        );

        document.getElementById("minutes").textContent = String(
          minutes,
        ).padStart(2, "0");

        document.getElementById("seconds").textContent = String(
          seconds,
        ).padStart(2, "0");
      }

      updateCountdown();
      setInterval(updateCountdown, 1000);
    </script>
  </body>
</html>
